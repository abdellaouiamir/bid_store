# maildev.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maildev
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maildev
  template:
    metadata:
      labels:
        app: maildev
    spec:
      containers:
        - name: maildev
          image: maildev/maildev
          ports:
            - containerPort: 1080
            - containerPort: 1025
---
apiVersion: v1
kind: Service
metadata:
  name: maildev
  namespace: microservices
spec:
  type: NodePort
  ports:
    - port: 1080
      targetPort: 1080
      nodePort: 30080  # UI accessible via <node-ip>:30080
      name: ui
    - port: 1025
      targetPort: 1025
      nodePort: 30025  # SMTP accessible via <node-ip>:30025
      name: smtp
  selector:
    app: maildev