apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
data:
  init.sql: |
    CREATE DATABASE bid;
    CREATE DATABASE payment;
    CREATE DATABASE product;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:latest
          env:
            - name: POSTGRES_USER
              value: "Amir"
            - name: POSTGRES_PASSWORD
              value: "Amir"
            - name: POSTGRES_DB
              value: "postgres" # Default database required by PostgreSQL
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: init-script
              mountPath: "/docker-entrypoint-initdb.d"
      volumes:
        - name: init-script
          configMap:
            name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP