spring:
  datasource:
    url: jdbc:postgresql://postgres-service:5432/product
    username: Amir
    password: Amir
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    enabled: true
    baseline-description: "init"
    baseline-version: 0
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
server:
  port: 8050
application:
  config:
    bid-url: http://bid-service:8070/api/v1/bid