apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app: notification-deployment
spec:
  selector:
    app: notification-deployment
  type: ClusterIP    # Use NodePort or ClusterIP if you don't need external access
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-deployment
  labels:
    app: notification-deployment
spec:
  replicas: 1          # Number of pod replicas
  selector:
    matchLabels:
      app: notification-deployment
  template:
    metadata:
      labels:
        app: notification-deployment
    spec:
      containers:
        - name: notification-deployment
          image: notification_image:latest    # Replace with your Docker image name
          imagePullPolicy: IfNotPresent  # Use Always if pulling from remote registry
          resources:
            requests:
              memory: "256Mi"
              cpu: "0.2"
            limits:
              memory: "512Mi"
              cpu: "0.5"